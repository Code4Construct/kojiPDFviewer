name: Build Windows MSI

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'VirusTotal で確認後、GitHub Release を公開する'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check release version
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'VERSION must be major.minor.patch' }
          if ($env:PUBLISH_RELEASE -eq 'true' -and '${{ github.ref_name }}' -ne $env:DEFAULT_BRANCH) {
            throw "Publish from the default branch ($env:DEFAULT_BRANCH) only"
          }
          if ($env:PUBLISH_RELEASE -eq 'true') {
            git ls-remote --exit-code --tags origin "refs/tags/v$version" | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "Tag v$version already exists. Increment VERSION before publishing again." }
            if ($LASTEXITCODE -ne 2) { throw 'Could not check existing tags on origin' }
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "MSI_NAME=MailPDFViewer_Setup_$version.msi" >> $env:GITHUB_ENV
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "nuitka>=2.8.9" ordered-set zstandard
      - name: Check app imports
        run: python -c "import main; print('App imports OK')"
      - name: Build standalone app
        shell: cmd
        run: build_nuitka.bat
      - name: Sign app executable if configured
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: ./scripts/sign-file.ps1 -Path main.dist/MailPDFViewer.exe
      - name: Install WiX Toolset 3
        shell: pwsh
        run: choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress
      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wix = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          $heat = Join-Path $wix 'heat.exe'
          $candle = Join-Path $wix 'candle.exe'
          $light = Join-Path $wix 'light.exe'
          foreach ($tool in @($heat, $candle, $light)) { if (!(Test-Path $tool)) { throw "Missing WiX tool: $tool" } }
          New-Item -ItemType Directory -Force installer\obj, installer\output | Out-Null
          & $heat dir main.dist -nologo -srd -sreg -gg -cg AppFiles -dr INSTALLFOLDER -var var.SourceDir -out installer\obj\HarvestedFiles.wxs
          if ($LASTEXITCODE -ne 0) { throw 'WiX heat failed' }
          & $candle -nologo -arch x64 "-dSourceDir=$pwd\main.dist" "-dProjectDir=$pwd" "-dAppVersion=$env:APP_VERSION" -out installer\obj\ installer\MailPDFViewer.wxs installer\obj\HarvestedFiles.wxs
          if ($LASTEXITCODE -ne 0) { throw 'WiX candle failed' }
          & $light -nologo -out "installer\output\$env:MSI_NAME" installer\obj\MailPDFViewer.wixobj installer\obj\HarvestedFiles.wixobj
          if ($LASTEXITCODE -ne 0) { throw 'WiX light failed' }
          if (!(Test-Path "installer\output\$env:MSI_NAME")) { throw 'MSI missing' }
      - name: Sign MSI if configured
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: ./scripts/sign-file.ps1 -Path "installer/output/$env:MSI_NAME"
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: installer/output/*.msi
          if-no-files-found: error
      - name: Scan MSI with VirusTotal
        if: inputs.publish_release
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: ./scripts/check-virustotal.ps1 -Path "installer/output/$env:MSI_NAME"
      - name: Write release notes
        if: inputs.publish_release
        shell: pwsh
        run: |
          $msi = "installer/output/$env:MSI_NAME"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          Windows MSI built with Nuitka and WiX.

          SHA256: $hash
          VirusTotal: https://www.virustotal.com/gui/file/$hash/detection
          "@ | Set-Content release-notes.md -Encoding utf8
      - name: Publish release
        if: inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists: $tag. Increment VERSION before publishing again." }
          gh release create $tag "installer/output/$env:MSI_NAME" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MailPDFViewer $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
