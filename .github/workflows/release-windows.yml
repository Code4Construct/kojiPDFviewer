name: Release kojiPDFviewer MSI

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'GitHub Release に表示する名前'
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: kojiPDFviewer-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check release inputs and version
        shell: pwsh
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ('${{ github.ref_name }}' -ne $env:DEFAULT_BRANCH) {
            throw "Release from the default branch ($env:DEFAULT_BRANCH) only"
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NAME)) { throw 'Release name is required' }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'VERSION must be major.minor.patch' }
          $tag = "v$version"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing tags on origin' }
          if ($existingTag) { throw "Tag $tag already exists. Increment VERSION before publishing again." }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "MSI_NAME=kojiPDFviewer_Setup_$version.msi" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Download MSI built from this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runJson = gh run list --repo $env:GITHUB_REPOSITORY --workflow build-windows.yml --commit $env:GITHUB_SHA --status success --json databaseId,headSha --limit 10
          if ($LASTEXITCODE -ne 0) { throw 'Could not find build workflow runs' }
          $run = @($runJson | ConvertFrom-Json) | Where-Object { $_.headSha -eq $env:GITHUB_SHA } | Select-Object -First 1
          if ($null -eq $run) { throw 'No successful MSI build exists for this commit. Wait for Build kojiPDFviewer MSI to finish.' }
          New-Item -ItemType Directory -Force installer/output | Out-Null
          gh run download $run.databaseId --repo $env:GITHUB_REPOSITORY --name windows-msi --dir installer/output
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the MSI artifact' }
          $msi = "installer/output/$env:MSI_NAME"
          if (!(Test-Path $msi) -or (Get-Item $msi).Length -eq 0) { throw "Expected MSI was not found: $msi" }
          "BUILD_RUN_ID=$($run.databaseId)" >> $env:GITHUB_ENV
      - name: Scan MSI with VirusTotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: ./scripts/check-virustotal.ps1 -Path "installer/output/$env:MSI_NAME"
      - name: Prepare release notes
        shell: pwsh
        run: |
          $msi = "installer/output/$env:MSI_NAME"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          Windows MSI built with Nuitka and WiX.

          SHA256: $hash
          VirusTotal: https://www.virustotal.com/gui/file/$hash/detection
          Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID
          "@ | Set-Content release-notes.md -Encoding utf8
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          gh release create $env:RELEASE_TAG "installer/output/$env:MSI_NAME" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $env:RELEASE_NAME --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
